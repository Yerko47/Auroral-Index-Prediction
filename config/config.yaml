project:
  name: "Auroral Geomagnetic Index Prediction"
  author: "Yerko Jelcic"
  version: 4
  seed: 42

  logging: True
  plot: True

dataset:
  time_range:
    start: "1995-01-01"
    end: "2018-03-01"
  
  omni_list: [
    "B_T",
    "BZ_GSE",
    "BZ_GSM",
    "flow_speed",
    "Vx",
    "T",
    "Pressure",
    "E"
  ]

  auroral_index: ["AE_INDEX"]

  calculate: [
    "epsilon",
    "E_kl",
    "dPhi_dt"
  ]

interpolation:
  # metodo aplicado a los gaps: auto | pchip | iterative | gp
  # auto: PCHIP bajo umbral_corto, imputacion multivariada sobre el umbral
  method: auto

  # largo de gap (min) que separa gaps cortos de largos cuando method es auto
  umbral_corto: 15

  # comparar los metodos con gaps sinteticos antes de aplicar
  benchmark: True

  benchmark_methods: ["pchip", "iterative", "gp"]
  benchmark_target: null       # null: primera columna con gaps
  n_repeticiones: 5
  n_gaps_por_repeticion: 40
  n_bins: 4                    # bins de largo derivados por cuantiles

  # figuras: metricas del benchmark y zonas de gap historicas
  plot_benchmark: True
  plot_history_diff: True
  max_figuras: 50

model:
  type: False
