project:
  name: "Auroral Geomagnetic Index Prediction"
  author: "Yerko Jelcic"
  version: 4
  seed: 42

  logging: True
  plot: True

dataset:
  time_range:
    start: "1995-01-01"
    end: "2018-03-01"
  
  omni_list: [
    "B_T",
    "BZ_GSE",
    "BZ_GSM",
    "flow_speed",
    "Vx",
    "T",
    "Pressure",
    "E"
  ]

  auroral_index: ["AE_INDEX"]

  calculate: [
    "epsilon",
    "E_kl",
    "dPhi_dt"
  ]

interpolation:
  benchmark: True   # (ignorado) el benchmark ahora solo corre si method=best
  reuse: True       # si existen los .feather interpolados en data/processed, se cargan y se omite recalcular
  method: best      # auto | pchip | iterative | gp | best
  umbral_corto: 15
  n_bins: 4
  n_gaps_por_repeticion: 40

  iterative:
    max_iter: 5     # MICE: iteraciones (5 suele converger; menos es mas rapido en 12MM filas)

  gp:
    windows: 120                 # contexto (min) a cada lado del hueco
    length_scale: 30.0           # escala del kernel RBF (min)
    noise_level: 0.1             # ruido del WhiteKernel
    optimize_hyperparams: False  # False deja el kernel fijo (mucho mas rapido con muchos huecos)

scaling:
  method: standard    # standard | robust | minmax


model:
  type: False
